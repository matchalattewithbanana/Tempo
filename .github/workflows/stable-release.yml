name: Stable release (explicit request, main only)

# Normal commits still do not build or publish. Stable publication starts only
# from a manual dispatch or an explicit declarative request committed to main.
on:
  push:
    branches:
      - main
    paths:
      - .github/stable-release-request.json
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish the validated Android and browser bundle
        required: true
        type: boolean
        default: false

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Unit tests, lint, APK and extension checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.release.outputs.version }}
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TEMPO_DEBUG_STORE_PASSWORD: ${{ secrets.TEMPO_DEBUG_STORE_PASSWORD }}
      TEMPO_DEBUG_KEY_ALIAS: ${{ secrets.TEMPO_DEBUG_KEY_ALIAS }}
      TEMPO_DEBUG_KEY_PASSWORD: ${{ secrets.TEMPO_DEBUG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Test version rollover boundaries
        run: |
          python3 .github/scripts/test_tempo_versioning.py
          python3 .github/scripts/test_release_bundle_metadata.py
      - name: Validate release version and package metadata
        id: release
        run: python3 .github/scripts/release-bundle.py stable >> "$GITHUB_OUTPUT"
      - name: Validate declarative stable release request
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(".github/stable-release-request.json").read_text())
          expected = {"channel": "stable", "version": os.environ["VERSION"], "publish": True}
          if request != expected:
              raise SystemExit(f"Invalid stable release request: expected {expected!r}, got {request!r}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare established signing key
        env:
          TEMPO_DEBUG_KEYSTORE_BASE64: ${{ secrets.TEMPO_DEBUG_KEYSTORE_BASE64 }}
          TEMPO_BETA_SIGNER_SHA256: fa14beee34664d2c41bc5db00f630b564992da649fa66cb4e62c523915c95407
          PUBLISH_STABLE: ${{ github.event_name == 'push' || inputs.publish_stable }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_STABLE" == true ]]; then
            bash .github/scripts/beta-signing.sh check-config
          fi
          umask 077
          if [[ -n "$TEMPO_DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$TEMPO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tempo-debug.jks"
            test -s "$RUNNER_TEMP/tempo-debug.jks"
            echo "TEMPO_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/tempo-debug.jks" >> "$GITHUB_ENV"
          else
            echo "Validation-only build with the runner debug signer."
          fi
      - run: chmod +x gradlew
      - name: Test signing verification
        run: bash .github/scripts/test-beta-signing.sh
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: |
          ./gradlew :app:lintDebug --stacktrace || { cat app/build/reports/lint-results-debug.txt; exit 1; }
      - name: Retain lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify APK and expected version
        env:
          TEMPO_BETA_SIGNER_SHA256: fa14beee34664d2c41bc5db00f630b564992da649fa66cb4e62c523915c95407
          PUBLISH_STABLE: ${{ github.event_name == 'push' || inputs.publish_stable }}
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          signer="$build_tools/apksigner"
          "$signer" verify --print-certs "$apk"
          if [[ "$PUBLISH_STABLE" == true ]]; then
            bash .github/scripts/beta-signing.sh verify "$signer" "$apk"
          else
            "$signer" verify "$apk"
          fi
          badging="$("$build_tools/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='me.avinas.tempo' versionCode='$VERSION_CODE' versionName='$VERSION'"
          echo "TEMPO_APK=$apk" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install extension dependencies
        working-directory: browser-extension
        run: npm ci
      - name: Extension typecheck
        working-directory: browser-extension
        run: npm run typecheck
      - name: Build browser packages
        working-directory: browser-extension
        run: npm run clean && npm run build:all
      - name: Extension smoke checks
        working-directory: browser-extension
        run: npm run smoke
      - name: Verify and stage the release bundle
        run: python3 .github/scripts/release-bundle.py stable --stage-apk "$TEMPO_APK"
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  platform:
    name: Android emulator tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Retain Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-platform-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

  publish:
    name: Publish immutable GitHub release
    needs: [validate, platform]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_stable) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tempo-release-bundle
          path: release-bundle
      - name: Verify the downloaded release bundle
        env:
          TEMPO_BETA_SIGNER_SHA256: fa14beee34664d2c41bc5db00f630b564992da649fa66cb4e62c523915c95407
        shell: bash
        run: |
          set -euo pipefail
          cd release-bundle
          sha256sum --check --strict SHA256SUMS.txt
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          bash ../.github/scripts/beta-signing.sh verify "$signer" "Tempo-$VERSION.apk"
      - name: Publish Android and browser packages
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          else
            test "$?" -eq 2
          fi
          notes="$(mktemp)"
          cat "docs/releases/$tag.md" > "$notes"
          printf '\nBuilt from [the tagged source](%s/%s/commit/%s). [Release validation](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$notes"
          gh release create "$tag" \
            "release-bundle/Tempo-$VERSION.apk" \
            "release-bundle/Tempo-Stats-Chromium-$VERSION.zip" \
            "release-bundle/Tempo-Stats-Firefox-$VERSION.zip" \
            release-bundle/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Tempo $VERSION" --notes-file "$notes" --latest
