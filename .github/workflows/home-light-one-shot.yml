name: One-shot Home and light-theme debug validation

# Temporary, explicitly requested build workflow. Never runs on main or PRs.
on:
  push:
    branches:
      - build/home-light-audit-2026-11-17

permissions:
  contents: read

concurrency:
  group: home-light-audit-once
  cancel-in-progress: true

jobs:
  apk:
    name: Unit tests, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TEMPO_DEBUG_STORE_PASSWORD: ${{ secrets.TEMPO_DEBUG_STORE_PASSWORD }}
      TEMPO_DEBUG_KEY_ALIAS: ${{ secrets.TEMPO_DEBUG_KEY_ALIAS }}
      TEMPO_DEBUG_KEY_PASSWORD: ${{ secrets.TEMPO_DEBUG_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Restore persistent debug signer when configured
        shell: bash
        env:
          TEMPO_DEBUG_KEYSTORE_BASE64: ${{ secrets.TEMPO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$TEMPO_DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$TEMPO_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tempo-debug.jks"
            echo "TEMPO_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/tempo-debug.jks" >> "$GITHUB_ENV"
            echo "Persistent debug signer enabled."
          else
            echo "::warning::No persistent signer; update may not install over older APKs."
          fi
      - run: chmod +x gradlew
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/test-output.log"; then exit 0; fi
            if ! grep -Fq "org.gradle.toolchains.foojay-resolver-convention" "$RUNNER_TEMP/test-output.log"; then exit 1; fi
            sleep $((15 * attempt))
          done
          exit 1
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Verify debug APK signer
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --print-certs "$apk"
          (cd app/build/outputs/apk/debug && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-home-light-audit-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  emulator:
    name: Android emulator instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
